<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in &middot; Noise Protocol</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}" />
</head>
<body>
  <!-- Aurora background -->
  <div class="scene" role="img" aria-label="Animated digital data background">
    <div class="grid-floor"></div>
    <div class="floor"></div>
    <div class="main-column"></div>
    <div class="light-stream-container" id="beams"></div>
  </div>

  <a class="auth-back" href="{{ url_for('index') }}"><i data-lucide="arrow-left"></i> Back to home</a>

  <div class="auth-shell">
    <div class="auth-card" data-mode="{{ mode }}">
      <div class="auth-brand"><span class="dot"></span> Noise</div>
      <h1 class="auth-title" id="auth-title">Welcome back</h1>
      <p class="auth-sub" id="auth-sub">Sign in to your secure portal.</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab" id="tab-login" role="tab">Log in</button>
        <button class="auth-tab" id="tab-signup" role="tab">Sign up</button>
      </div>

      <form id="auth-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="yourname" autocomplete="username" required />
        </div>
        <div class="field" id="email-field" hidden>
          <label for="email">Email <span style="color:var(--muted)">(optional)</span></label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">
          <span id="submit-label">Log in</span>
        </button>
        <div class="auth-msg" id="auth-msg" role="alert" aria-live="polite"></div>
      </form>

      <p class="auth-hint" id="auth-hint"></p>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
